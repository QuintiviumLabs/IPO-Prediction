# Optional YAML overrides — every key mirrors ipo_model/config.py.
# Anything omitted keeps the dataclass default. Pass with --config.

data:
  horizons: [1, 3, 5, 21]   # trading days: 1d, 3d, 1w, 1m; last = main target
  market_adjust: true
  momentum_max_deals: 10
  momentum_window_days: 90
  momentum_extended: true   # add deal count + IQR to the F1 spec
  momentum_horizons: [1, 5]
  supply_window_days: 90
  supply_trailing_days: 365
  prestige_years: 3         # bookrunner prestige: trailing IPO-share window
  regime_pop_window: 10     # market regime: mean pop of prior N same-market IPOs
  gpr_window: 21
  min_bookrunner_deals: 20

split:
  n_folds: 5
  min_train_frac: 0.35
  val_frac: 0.15
  embargo_days: 5

model:
  head: binary              # binary = P(outperform benchmark) | quantile = q10/50/90
  static_input_dropout: 0.2 # anti-overfit: randomly mask sector/bank inputs in training
  l1_static: 0.001          # anti-overfit: group-lasso zeroes unhelpful banks/flags
  use_momentum: true
  # f1 recent-deal perf | f2 break rate | f3 supply | m macro | p1 peers
  momentum_groups: [f1, f2, f3, m, p1]
  use_gpr: true
  gpr_mode: gru             # level | engineered | gru (lstm = legacy alias)
  gating: none              # none | film
  dropout: 0.25

train:
  class_weight: balanced    # binary head: weight classes by the train base rate
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 128
  max_epochs: 200
  patience: 20
  seeds: [0, 1, 2, 3, 4]
